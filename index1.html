<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Наші миті</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
    }

    #starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      gap: clamp(12px, 2.2vh, 20px);
    }

    .header {
      text-align: center;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: clamp(1.25rem, 4.5vw, 2.1rem);
      font-weight: 400;
      letter-spacing: 0.05em;
    }

    /* Адаптивний контейнер слайдшоу під телефон, планшет і десктоп */
    .slideshow {
      position: relative;
      width: min(900px, 94vw);
      height: min(62dvh, 560px);
      border-radius: clamp(14px, 2.5vw, 20px);
      overflow: hidden;
      background: #07080c;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      touch-action: pan-y;
    }

    /* Портретна орієнтація на телефонах */
    @media (max-width: 600px) and (orientation: portrait) {
      .slideshow {
        width: 94vw;
        height: min(64dvh, 125vw);
      }
    }

    /* Планшети у портретному режимі */
    @media (min-width: 601px) and (max-width: 1024px) and (orientation: portrait) {
      .slideshow {
        width: 88vw;
        height: min(62dvh, 82vw);
      }
    }

    /* Горизонтальний режим на низьких екранах (телефон повернутий боком) */
    @media (max-height: 500px) and (orientation: landscape) {
      .page {
        gap: 8px;
        padding-top: 8px;
        padding-bottom: 8px;
      }
      .header h1 {
        font-size: 1.05rem;
      }
      .slideshow {
        width: min(76vw, 680px);
        height: 68dvh;
      }
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.85s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: clamp(22px, 4vh, 32px) clamp(14px, 3vw, 22px) clamp(12px, 2vh, 16px);
      background: linear-gradient(to top, rgba(0, 0, 0, 0.84), transparent);
      font-size: clamp(0.9rem, 2.6vw, 1.1rem);
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.94);
    }

    /* Збільшена зона натискання кнопок для пальців на мобільному */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: clamp(38px, 8vw, 44px);
      height: clamp(38px, 8vw, 44px);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      font-size: 1.35rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.2s ease, transform 0.15s ease;
      z-index: 3;
    }

    .nav-btn:active {
      transform: translateY(-50%) scale(0.92);
      background: rgba(255, 255, 255, 0.22);
    }

    @media (hover: hover) {
      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.18);
      }
    }

    .prev { left: clamp(8px, 2vw, 14px); }
    .next { right: clamp(8px, 2vw, 14px); }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      flex-shrink: 0;
    }

    .dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Зручна площа тапу для крапок на сенсорному екрані */
    .dot-hit {
      padding: 6px 3px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .dot {
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.3);
      transition: width 0.25s ease, background 0.25s ease;
    }

    .dot-hit.active .dot {
      width: 22px;
      background: #ffffff;
    }

    .toggle-btn {
      padding: 8px 15px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .toggle-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    @media (hover: hover) {
      .toggle-btn:hover {
        background: rgba(255, 255, 255, 0.16);
      }
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>

  <main class="page">
    <header class="header">
      <h1>Ми❤️</h1>
    </header>

    <section class="slideshow" id="slideshow" aria-label="Слайдшоу фотографій">
      <div id="slides-container"></div>
      <button class="nav-btn prev" id="prevBtn" aria-label="Попереднє фото">‹</button>
      <button class="nav-btn next" id="nextBtn" aria-label="Наступне фото">›</button>
    </section>

    <div class="controls">
      <div class="dots" id="dots"></div>
      <button class="toggle-btn" id="toggleAuto">Пауза</button>
    </div>
    <a href="kupon.html">Неважно...</a>
  </main>

  <script>
    const PHOTOS = [
      { src: "top/1.jpg", caption: "Чіл Чіл ЧІл" },
      { src: "top/2.jpg", caption: "Компашка сицілії" },
      { src: "top/3.jpg", caption: "Ще одна тепла мить разом" }
    ];

    const AUTOPLAY_DELAY = 4200;

    const slidesContainer = document.getElementById("slides-container");
    const dotsContainer = document.getElementById("dots");
    const slideshowEl = document.getElementById("slideshow");
    const toggleBtn = document.getElementById("toggleAuto");

    let currentIndex = 0;
    let isPlaying = true;
    let timerId = null;

    PHOTOS.forEach((photo, idx) => {
      const slide = document.createElement("div");
      slide.className = `slide${idx === 0 ? " active" : ""}`;

      const img = document.createElement("img");
      img.src = photo.src;
      img.alt = photo.caption || `Фото ${idx + 1}`;
      img.draggable = false;
      slide.appendChild(img);

      if (photo.caption) {
        const cap = document.createElement("div");
        cap.className = "caption";
        cap.textContent = photo.caption;
        slide.appendChild(cap);
      }

      slidesContainer.appendChild(slide);

      const dotHit = document.createElement("button");
      dotHit.className = `dot-hit${idx === 0 ? " active" : ""}`;
      dotHit.setAttribute("aria-label", `Перейти до фото ${idx + 1}`);
      dotHit.innerHTML = `<span class="dot"></span>`;
      dotHit.addEventListener("click", () => {
        goToSlide(idx);
        restartAutoplay();
      });
      dotsContainer.appendChild(dotHit);
    });

    const slideEls = Array.from(document.querySelectorAll(".slide"));
    const dotEls = Array.from(document.querySelectorAll(".dot-hit"));

    function goToSlide(index) {
      if (!slideEls.length) return;
      slideEls[currentIndex].classList.remove("active");
      dotEls[currentIndex].classList.remove("active");
      currentIndex = (index + slideEls.length) % slideEls.length;
      slideEls[currentIndex].classList.add("active");
      dotEls[currentIndex].classList.add("active");
    }

    function nextSlide() { goToSlide(currentIndex + 1); }
    function prevSlide() { goToSlide(currentIndex - 1); }

    function startAutoplay() {
      stopAutoplay();
      if (isPlaying && slideEls.length > 1) {
        timerId = setInterval(nextSlide, AUTOPLAY_DELAY);
      }
    }

    function stopAutoplay() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function restartAutoplay() {
      if (isPlaying) startAutoplay();
    }

    document.getElementById("nextBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      nextSlide();
      restartAutoplay();
    });

    document.getElementById("prevBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      prevSlide();
      restartAutoplay();
    });

    toggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      isPlaying = !isPlaying;
      toggleBtn.textContent = isPlaying ? "Пауза" : "Продовжити";
      if (isPlaying) startAutoplay();
      else stopAutoplay();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { nextSlide(); restartAutoplay(); }
      else if (e.key === "ArrowLeft") { prevSlide(); restartAutoplay(); }
    });

    // Свайпи + спалах при тапі по фото
    let touchStartX = 0;
    let touchStartY = 0;
    let isSwiping = false;

    slideshowEl.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      isSwiping = false;
    }, { passive: true });

    slideshowEl.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      if (Math.abs(t.clientX - touchStartX) > 12) {
        isSwiping = true;
      }
    }, { passive: true });

    slideshowEl.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0];
      const diffX = t.clientX - touchStartX;
      const diffY = t.clientY - touchStartY;

      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) nextSlide();
        else prevSlide();
        restartAutoplay();
      } else if (!isSwiping && !e.target.closest("button")) {
        triggerBurst(t.clientX, t.clientY);
      }
    }, { passive: true });

    startAutoplay();

    // --- Зірки + адаптивні партікли для миші та тачу ---
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");

    let viewW = window.innerWidth;
    let viewH = window.innerHeight;
    let stars = [];
    let softParticles = [];
    let bursts = [];
    let shootingStar = null;
    let lastTrailTime = 0;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      viewW = window.innerWidth;
      viewH = window.innerHeight;

      canvas.width = Math.floor(viewW * dpr);
      canvas.height = Math.floor(viewH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const area = viewW * viewH;
      const starCount = Math.max(85, Math.min(220, Math.floor(area / 6200)));
      stars = Array.from({ length: starCount }, () => ({
        x: Math.random() * viewW,
        y: Math.random() * viewH,
        r: Math.random() * 1.5 + 0.35,
        alpha: Math.random(),
        delta: (Math.random() * 0.012 + 0.003) * (Math.random() < 0.5 ? 1 : -1)
      }));

      const dustCount = viewW < 600 ? 18 : 28;
      softParticles = Array.from({ length: dustCount }, () => ({
        x: Math.random() * viewW,
        y: Math.random() * viewH,
        r: Math.random() * 2 + 0.8,
        vx: (Math.random() - 0.5) * 0.25,
        vy: -(Math.random() * 0.25 + 0.08),
        alpha: Math.random() * 0.45 + 0.15
      }));
    }

    function addSpark(x, y, speedScale = 1, lifeDecay = 0.025) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (Math.random() * 1.6 + 0.4) * speedScale;
      bursts.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: Math.random() * 1.8 + 0.6,
        life: 1,
        decay: lifeDecay
      });
    }

    function triggerTrail(x, y) {
      const now = performance.now();
      if (now - lastTrailTime > 30) {
        addSpark(x, y, 0.45, 0.038);
        lastTrailTime = now;
      }
    }

    function triggerBurst(x, y) {
      const count = viewW < 600 ? 12 : 16;
      for (let i = 0; i < count; i++) {
        addSpark(x, y, 1.3, 0.024);
      }
    }

    // Десктоп: миша
    window.addEventListener("mousemove", (e) => {
      triggerTrail(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener("click", (e) => {
      if (!e.target.closest("button")) {
        triggerBurst(e.clientX, e.clientY);
      }
    });

    // Телефон і планшет: ведення пальцем по екрану + тап по фону
    window.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      if (t) triggerTrail(t.clientX, t.clientY);
    }, { passive: true });

    window.addEventListener("touchstart", (e) => {
      if (e.target.closest("#slideshow") || e.target.closest("button")) return;
      const t = e.touches[0];
      if (t) triggerBurst(t.clientX, t.clientY);
    }, { passive: true });

    function spawnShootingStar() {
      if (shootingStar) return;
      shootingStar = {
        x: Math.random() * viewW * 0.7,
        y: Math.random() * viewH * 0.3,
        vx: (viewW < 600 ? 4.5 : 6.5) + Math.random() * 2.5,
        vy: (viewW < 600 ? 2.5 : 3.2) + Math.random() * 1.8,
        life: 1
      };
    }

    function render() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, viewW, viewH);

      for (const s of stars) {
        s.alpha += s.delta;
        if (s.alpha <= 0.15 || s.alpha >= 1) s.delta *= -1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha.toFixed(3)})`;
        ctx.fill();
      }

      for (const p of softParticles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < -10) {
          p.y = viewH + 10;
          p.x = Math.random() * viewW;
        }
        if (p.x < -10) p.x = viewW + 10;
        if (p.x > viewW + 10) p.x = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 232, 255, ${p.alpha})`;
        ctx.fill();
      }

      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vx *= 0.96;
        b.vy *= 0.96;
        b.life -= b.decay;
        if (b.life <= 0) {
          bursts.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${b.life.toFixed(3)})`;
        ctx.fill();
      }

      if (shootingStar) {
        const tail = viewW < 600 ? 6 : 8;
        const grad = ctx.createLinearGradient(
          shootingStar.x,
          shootingStar.y,
          shootingStar.x - shootingStar.vx * tail,
          shootingStar.y - shootingStar.vy * tail
        );
        grad.addColorStop(0, `rgba(255, 255, 255, ${shootingStar.life})`);
        grad.addColorStop(1, "rgba(255, 255, 255, 0)");

        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(shootingStar.x, shootingStar.y);
        ctx.lineTo(shootingStar.x - shootingStar.vx * tail, shootingStar.y - shootingStar.vy * tail);
        ctx.stroke();

        shootingStar.x += shootingStar.vx;
        shootingStar.y += shootingStar.vy;
        shootingStar.life -= 0.024;
        if (shootingStar.life <= 0) shootingStar = null;
      }

      requestAnimationFrame(render);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 120));
    resizeCanvas();
    setInterval(() => {
      if (Math.random() < 0.45) spawnShootingStar();
    }, 3500);
    render();
  </script>
</body>
</html>

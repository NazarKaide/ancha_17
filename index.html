<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Для тебе 🤍</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #030611;
            --card-bg: rgba(10, 16, 32, 0.7);
            --text-main: #f1f5f9;
            --text-muted: #8b9bb4;
            --accent-blue: #3b82f6;
            --accent-light-blue: #93c5fd;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --border: rgba(255, 255, 255, 0.08);
            --container-padding: clamp(16px, 4vw, 32px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: clamp(40px, 8vw, 90px) var(--container-padding);
            min-height: 100vh;
            position: relative;
        }

        /* Deep Blue Background Glows */
        .bg-glows {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.7;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            animation: floatOrb 14s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(29, 78, 216, 0.3) 0%, transparent 70%);
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            bottom: -5%;
            right: -5%;
            background: radial-gradient(circle, rgba(30, 58, 138, 0.4) 0%, transparent 70%);
            animation-duration: 18s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Falling Stars Canvas */
        #stars-canvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: clamp(40px, 8vw, 80px);
        }

        .tag {
            font-size: clamp(0.75rem, 2vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 0.35em;
            color: var(--accent-light-blue);
            margin-bottom: clamp(10px, 2vw, 16px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            background: rgba(30, 58, 138, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(96, 165, 250, 0.2);
            box-shadow: 0 0 15px rgba(29, 78, 216, 0.2);
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.4rem, 7.5vw, 4.5rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.01em;
            margin-bottom: clamp(14px, 3vw, 24px);
            background: linear-gradient(180deg, #ffffff 30%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .heart-icon {
            display: inline-block;
            color: #60a5fa;
            -webkit-text-fill-color: initial;
            animation: pulseHeart 2.5s infinite ease-in-out;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(96, 165, 250, 0.4)); }
            50% { transform: scale(1.18); filter: drop-shadow(0 0 16px rgba(96, 165, 250, 0.8)); }
        }

        header p {
            color: var(--text-muted);
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            font-weight: 300;
            max-width: 520px;
            margin: 0 auto;
            padding: 0 8px;
        }

        /* Gallery Header */
        .section-header {
            margin-bottom: clamp(24px, 4vw, 36px);
            text-align: center;
        }

        .section-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.4rem, 3.5vw, 1.85rem);
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before, .section-title::after {
            content: "✨";
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(12px, 2.5vw, 22px);
            margin-bottom: clamp(50px, 10vw, 90px);
        }

        .photo-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: clamp(14px, 2vw, 20px);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(16px);
            width: 100%;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .photo-card.tall { grid-row: span 2; aspect-ratio: 1/2; }
        .photo-card.square { aspect-ratio: 1/1; }
        .photo-card.portrait { aspect-ratio: 3/4; }

        @media (hover: hover) {
            .photo-card:hover {
                border-color: rgba(96, 165, 250, 0.5);
                box-shadow: 0 15px 40px -5px var(--accent-glow);
                transform: translateY(-6px) scale(1.015);
            }
            .photo-card:hover img {
                transform: scale(1.06);
                filter: brightness(1.05) contrast(1.02);
            }
        }

        .photo-card:active {
            transform: scale(0.96);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.88) contrast(1.02);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
            display: block;
        }

        /* Wishes Card */
        .wishes-card {
            background: linear-gradient(145deg, rgba(10, 16, 32, 0.85), rgba(5, 9, 20, 0.9));
            border: 1px solid rgba(96, 165, 250, 0.25);
            border-radius: clamp(18px, 3vw, 26px);
            padding: clamp(32px, 6vw, 60px) clamp(20px, 5vw, 44px);
            text-align: center;
            backdrop-filter: blur(20px);
            position: relative;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            width: 100%;
        }

        .wishes-card h2 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 400;
            margin-bottom: clamp(12px, 2vw, 18px);
            color: #ffffff;
        }

        .wishes-card p {
            color: var(--text-muted);
            font-weight: 300;
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            max-width: 520px;
            margin: 0 auto clamp(28px, 5vw, 40px);
            line-height: 1.7;
        }

        .btn-celebrate {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.35), rgba(29, 78, 216, 0.25));
            color: #ffffff;
            border: 1px solid rgba(147, 197, 253, 0.4);
            padding: clamp(14px, 2.5vw, 18px) clamp(28px, 5vw, 40px);
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 25px rgba(29, 78, 216, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        @media (hover: hover) {
            .btn-celebrate:hover {
                background: linear-gradient(135deg, #2563eb, #1d4ed8);
                border-color: #93c5fd;
                box-shadow: 0 10px 35px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.4);
                transform: translateY(-3px) scale(1.03);
            }
        }

        .btn-celebrate:active {
            transform: translateY(0) scale(0.97);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 4, 10, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: clamp(16px, 3vw, 28px);
            backdrop-filter: blur(20px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-container {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 100%;
            max-height: 85vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 50px rgba(37, 99, 235, 0.25);
        }

        .modal-close {
            position: absolute;
            top: -44px;
            right: 0;
            color: var(--text-muted);
            font-size: 2rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
        }

        /* Responsive Breakpoints */
        @media (max-width: 840px) {
            .gallery-grid { grid-template-columns: repeat(3, 1fr); }
            .photo-card.tall { grid-row: span 1; aspect-ratio: 3/4; }
        }

        @media (max-width: 520px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .photo-card.tall, .photo-card.square, .photo-card.portrait {
                grid-row: span 1;
                aspect-ratio: 3/4;
            }
            .modal-close { top: -48px; right: 0; }
        }
    </style>
</head>
<body>

    <!-- Deep Blue Background Glow Orbs -->
    <div class="bg-glows">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <!-- Falling Stars Canvas -->
    <canvas id="stars-canvas"></canvas>

    <div class="container">
        <!-- Header -->
        <header>
            <span class="tag">✦ Особливі моменти ✦</span>
            <h1>Наша історія <span class="heart-icon">🤍</span></h1>
            <p>Невеличке місце у всесвіті, збережене спеціально для тебе та наших спогадів.</p>
        </header>

        <!-- Gallery -->
        <section>
            <div class="section-header">
                <div class="section-title">Наші миті</div>
            </div>

            <div class="gallery-grid">
                <div class="photo-card tall" onclick="openModal(this)">
                    <img src="css/0.jpg" alt="Момент">
                </div>
                <div class="photo-card square" onclick="openModal(this)">
                    <img src="css/1.jpg" alt="Момент">
                </div>
                <div class="photo-card portrait" onclick="openModal(this)">
                    <img src="css/2.jpg" alt="Момент">
                </div>
                <div class="photo-card portrait" onclick="openModal(this)">
                    <img src="css/3.jpg" alt="Момент">
                </div>
                <div class="photo-card square" onclick="openModal(this)">
                    <img src="css/4.jpg" alt="Момент">
                </div>
                <div class="photo-card portrait" onclick="openModal(this)">
                    <img src="css/5.jpg" alt="Момент">
                </div>
                <div class="photo-card tall" onclick="openModal(this)">
                    <img src="css/6.jpg" alt="Момент">
                </div>
                <div class="photo-card square" onclick="openModal(this)">
                    <img src="css/7.jpg" alt="Момент">
                </div>
                <div class="photo-card portrait" onclick="openModal(this)">
                    <img src="css/8.jpg" alt="Момент">
                </div>
                <div class="photo-card portrait" onclick="openModal(this)">
                    <img src="css/9.jpg" alt="Момент">
                </div>
                <div class="photo-card square" onclick="openModal(this)">
                    <img src="css/12.jpg" alt="Момент">
                </div>
                <div class="photo-card portrait" onclick="openModal(this)">
                    <img src="css/11.jpg" alt="Момент">
                </div>
                <div class="photo-card portrait" onclick="openModal(this)">
                    <img src="css/13.jpg" alt="Момент">
                </div>
            </div>
        </section>

        <!-- Note Section -->
        <div class="wishes-card">
            <h2>Для моєї найдорожчої ✨</h2>
            <p>Дякую за твоє відчуття гумору, ніжність, підтримку та за кожну усмішку, яку ти мені даруєш. Ти робиш цей світ світлішим.</p>
            <button class="btn-celebrate" onclick="celebrate()">
                <span>Запустити зорепад</span>
                <span>✨</span>
            </button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal" onclick="closeModal()">
        <div class="modal-container" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()" aria-label="Закрити">&times;</button>
            <img id="modal-img" src="" alt="Enlarged moment">
        </div>
    </div>

    <script>
        /* Falling Stars Particle Engine */
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class FallingStar {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : -20;
                this.length = Math.random() * 12 + 6;
                this.speed = Math.random() * 1.8 + 0.6;
                this.size = Math.random() * 1.8 + 0.6;
                this.alpha = Math.random() * 0.7 + 0.3;
                this.drift = Math.random() * 0.4 - 0.2; // slight wind sideways
            }

            update() {
                this.y += this.speed;
                this.x += this.drift;

                if (this.y > height + 20) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                
                // Falling star trail gradient
                let grad = ctx.createLinearGradient(this.x, this.y, this.x - this.drift * 3, this.y - this.length);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, '#93c5fd');
                grad.addColorStop(1, 'transparent');

                ctx.strokeStyle = grad;
                ctx.lineWidth = this.size;
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.drift * 3, this.y - this.length);
                ctx.stroke();

                // Glowing head of the star
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#60a5fa';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.8, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Init star field
        const starCount = Math.min(window.innerWidth > 768 ? 70 : 40, 90);
        for (let i = 0; i < starCount; i++) {
            stars.push(new FallingStar());
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        /* Sparkle Confetti Explosion */
        function celebrate() {
            const count = 220;
            const defaults = { origin: { y: 0.75 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, {
                spread: 30,
                startVelocity: 55,
                colors: ['#60a5fa', '#93c5fd', '#ffffff']
            });

            fire(0.2, {
                spread: 65,
                colors: ['#3b82f6', '#1d4ed8', '#bfdbfe']
            });

            fire(0.35, {
                spread: 100,
                decay: 0.9,
                scalar: 0.8,
                colors: ['#ffffff', '#93c5fd']
            });

            fire(0.2, {
                spread: 120,
                startVelocity: 35,
                decay: 0.92,
                scalar: 1.1
            });
        }

        /* Modal handling */
        function openModal(card) {
            const img = card.querySelector('img');
            if (img) {
                document.getElementById('modal-img').src = img.src;
                const modal = document.getElementById('modal');
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Посміхнись)</title>
  <style>
    body {
      background: #0f172a;
      color: #fff;
      font-family: system-ui, sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h1 { font-size: 3rem; margin-bottom: 2rem; }
    .run-btn {
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      background: #ec4899;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      position: absolute;
      transition: all 0.15s ease-out;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
    }
  </style>
</head>
<body>

  <h1>посміхнись)</h1>
  <button class="run-btn" id="btn">Натисни тут 😄</button>

  <script>
    const btn = document.getElementById('btn');
    
    function moveButton() {
      const x = Math.random() * (window.innerWidth - btn.offsetWidth - 40) + 20;
      const y = Math.random() * (window.innerHeight - btn.offsetHeight - 40) + 20;
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    }

    btn.addEventListener('mouseover', moveButton);
    btn.addEventListener('touchstart', moveButton);
  </script>
</body>
</html>

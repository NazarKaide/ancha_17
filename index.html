<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Посміхнись)</title>
  <style>
    body {
      background: #18181b;
      color: #fafafa;
      font-family: system-ui, sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
    }
    h1 {
      font-size: 4rem;
      animation: pulse 1.5s infinite alternate ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); text-shadow: 0 0 20px #facc15; }
    }
    .emoji-particle {
      position: absolute;
      font-size: 2rem;
      pointer-events: none;
      animation: explode 0.8s forwards ease-out;
    }
    @keyframes explode {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(360deg); }
    }
  </style>
</head>
<body>

  <h1>посміхнись)</h1>

  <script>
    const emojis = ['😊', '😄', '✨', '💛', '😎', '🥳', '😉'];

    document.addEventListener('click', (e) => {
      for (let i = 0; i < 12; i++) {
        const particle = document.createElement('div');
        particle.className = 'emoji-particle';
        particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        particle.style.left = `${e.clientX}px`;
        particle.style.top = `${e.clientY}px`;

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 120 + 50;
        particle.style.setProperty('--dx', `${Math.cos(angle) * velocity}px`);
        particle.style.setProperty('--dy', `${Math.sin(angle) * velocity}px`);

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 800);
      }
    });
  </script>
</body>
</html>

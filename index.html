<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Посміхнись)</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .typewriter {
      font-size: 3rem;
      font-weight: bold;
      overflow: hidden;
      border-right: .15em solid #f59e0b; /* Курсор */
      white-space: nowrap;
      width: 0;
      animation: 
        typing 2.5s steps(12, end) forwards,
        blink-caret .75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 12ch; } /* Довжина фрази в символах */
    }

    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: #f59e0b; }
    }
  </style>
</head>
<body>

  <div class="typewriter">посміхнись)</div>

</body>
</html>

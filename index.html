<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Посміхнись)</title>
  <style>
    body {
      background: #09090b;
      color: #38bdf8;
      font-family: monospace;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="text"></div>

  <script>
    const phrases = [
      "Привіт...",
      "Я знаю, що ти зараз дивишся в екран 👀",
      "І обличчя у тебе надто серйозне...",
      "Так краще не треба!",
      "Ну-ка...",
      "посміхнись) 💛"
    ];

    const container = document.getElementById('text');
    let index = 0;

    function showNextPhrase() {
      if (index < phrases.length) {
        container.style.opacity = 0;
        setTimeout(() => {
          container.innerText = phrases[index];
          container.style.transition = "opacity 0.5s";
          container.style.opacity = 1;
          index++;
          setTimeout(showNextPhrase, 2200);
        }, 300);
      }
    }

    showNextPhrase();
  </script>
</body>
</html>
